extends: mcp.tool::au-mcp-sdk
fields:
  #: Discover source sets, list one directory, read bounded bytes, extract one PDF page's text, or inspect/filter a FabriTRAK DBF.
  action: [sets, list, read, pdf_text, dbf_schema, dbf_rows, dbf_catalog]
  #: Owner-bound source set; required except for sets.
  source_set?: [fabritrak, pdfs, transcripts, manufacturing-audit]
  #: Relative directory or file path within the source set; empty or omitted means root for list.
  path?: String
  #: Directory-entry offset for list, byte offset for read, Unicode-character offset for pdf_text, or physical record index for DBF rows/catalog. A bounded miss is not corpus-wide absence; follow next_offset with the same selection and hashes.
  offset?: Number{>=0 & integer}
  #: Maximum entries for list (50), bytes for read (4096), characters for pdf_text (4096), or matching rows for DBF rows/catalog (5).
  limit?: Number{>=1 & integer}
  #: For read: utf-8, latin-1 or base64. Text offsets and continuations are byte offsets.
  encoding?: [utf-8, latin-1, base64]
  #: pdf_text only. Explicit one-based PDF page (1..10000); only owner-bound pdfs .pdf files up to 32 MiB. Requires host poppler-utils. Not OCR or verified geometry; no text means visual/OCR review, not absent specifications.
  page?: Number{>=1 & <=10000 & integer}
  #: pdf_text only. Lowercase measured PDF SHA256; mandatory for page > 1 or offset > 0. offset/limit count Unicode characters (max 4096 per response), not PDF bytes.
  expected_pdf_sha256?: String
  #: pdf_text only. Lowercase extracted page text SHA256, mandatory for offset > 0. Prevents mixing character pages across extractor/font changes; mismatch requires restarting the page.
  expected_text_sha256?: String
  #: Exact QUOTE_NO; legacy schema-gated filter. Choose one complete key form listed by dbf_schema.exact_filters, never mix forms. Keys are case-sensitive trimmed stored strings.
  quote_no?: String
  #: Exact catalog identifier in one unambiguous ID, FORM_ID or OPER_ID character column; legacy alternative to quote_no.
  record_id?: String
  #: dbf_catalog only: optional 1..80 character case-insensitive literal substring in fixed ID/name fields; omit to browse. Only MATERIAL, OPERATIO and FORMULA with verified schema shapes. No ranking or automatic applicability; preserve duplicate candidates.
  query?: String
  #: Exact QUOTLETTER alone for QUOTLETT, or with item for QUOTLINE/QUOTLEIT.
  quotletter?: String
  #: Exact character ITEM including leading zeros, required with quotletter for QUOTLINE/QUOTLEIT.
  item?: String
  #: Exact WO_NO for WOHEAD/WOJOBS/WOSEQ/WOCOLL/WOSHIP/SOLOTS/WOBOM/WOBILL; optionally with page_no and seq only for WOSEQ/WOCOLL.
  wo_no?: String
  #: Exact JOBNO for SOMAST/SOLOTS/WOJOBS/WOBOM, an alternative key form (not combined with wo_no).
  jobno?: String
  #: Exact trimmed PAGE_NO numeric-field text, required together with wo_no and seq for the operation composite key. No numeric coercion.
  page_no?: String
  #: Exact character SEQ including leading zeros, required with wo_no and page_no for WOSEQ/WOCOLL.
  seq?: String
  #: Lowercase SHA256 from a prior DBF citation; DBF rows/catalog fail closed on mismatch. Required for dbf_catalog when offset > 0.
  expected_dbf_sha256?: String
  #: dbf_rows only: up to four explicitly selected memo field names. Default remains unresolved null, not empty text.
  memo_fields?: String[]
  #: dbf_rows only with memo_fields: same-directory, same-stem FPT relative path; owner-root and no-symlink confinement apply.
  fpt_path?: String
  #: Optional lowercase FPT SHA256; required alongside DBF hash for trustworthy continuations.
  expected_fpt_sha256?: String
  #: Byte offset into each selected memo payload (default zero). Follow next_offset with both hashes pinned.
  memo_offset?: Number{>=0 & integer}
  #: Per-memo byte page up to 4096 bytes, default 2048; at most four fields and five rows.
  memo_limit?: Number{>=1 & <=4096 & integer}
meta:
  - type: plugin-runtime-meta::au-mcp-sdk
    entry: ./arsumbris/sources/tool.ts
    contractVersion: 0
  - type: tool-access-meta::au-mcp-sdk
    broker: none
  - type: tool-presentation-meta::au-mcp-sdk
    description: "Operator-only, read-only, owner-bound Keller private source sets: inventory, bounded bytes and stdlib DBF rows/schema with approved exact keys. dbf_catalog browses or searches fixed ID/name fields only in MATERIAL, OPERATIO and FORMULA definitions; it does not select applicable records, interpret rates/formulas or scan quote history. No arbitrary paths, columns, predicates, SQL, writes, or archive access for blinded workers. DBFs are capped at 512 MiB; row pages scan at most 20000 physical records and 16 MiB, returning at most 5 matches. DBF citations include a measured file SHA256 (not external-catalog authentication); rows include zero-based physical index, byte offset, length and SHA256. Deleted rows are excluded and malformed scanned records fail closed. Null memo values mean unresolved, not empty; labeled base64 bytes are raw pointers. Explicit memo_fields/fpt_path opt-in returns bounded hash-bound FPT text with offsets, statuses and continuations. Decoded text is untrusted evidence, not verified geometry/specifications or applicability. A bounded filter miss is not corpus-wide absence. Historical estimates may support human-reviewed prospective pricing, not guaranteed actual/current costs or automatic customer release."
