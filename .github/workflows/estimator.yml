name: Estimator

on:
  push:
    paths:
      - 'estimator/**'
      - 'evals/**'
      - 'scripts/**'
      - 'tests/**'
      - 'db/**'
      - 'requirements-db.txt'
      - 'quotes.csv'
      - '.github/workflows/estimator.yml'
  pull_request:
    paths:
      - 'estimator/**'
      - 'evals/**'
      - 'scripts/**'
      - 'tests/**'
      - 'db/**'
      - 'requirements-db.txt'
      - 'quotes.csv'
      - '.github/workflows/estimator.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: estimator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: estimator/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node "$(node -p 'require("./package.json").bin.estimate')" examples/request.json --offline > /dev/null
      - run: node --test scripts/test/*.test.mjs
        working-directory: .

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-db.txt
      - run: python -m unittest discover -s tests -v
        env:
          KELLER_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres?sslmode=disable
