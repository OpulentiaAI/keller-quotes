name: Estimator

on:
  push:
    paths:
      - 'estimator/**'
      - 'evals/**'
      - 'quotes.csv'
      - '.github/workflows/estimator.yml'
  pull_request:
    paths:
      - 'estimator/**'
      - 'evals/**'
      - 'quotes.csv'
      - '.github/workflows/estimator.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: estimator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: estimator/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node "$(node -p 'require("./package.json").bin.estimate')" examples/request.json --offline > /dev/null
