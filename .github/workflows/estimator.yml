name: Estimator

on:
  workflow_dispatch:
  push:
    paths:
      - 'estimator/**'
      - 'evals/**'
      - 'scripts/**'
      - 'tests/**'
      - 'db/**'
      - '.arsumbris/**'
      - '.agents/skills/**'
      - 'arsumbris/**'
      - 'catalog/**'
      - 'inject/**'
      - 'profiles/**'
      - 'skills/**'
      - 'type/**'
      - 'workspace-*.yaml'
      - 'requirements-db.txt'
      - 'requirements-documents.txt'
      - 'quotes.csv'
      - 'docs/host-automation-prompt.md'
      - '.github/workflows/estimator.yml'
  pull_request:
    paths:
      - 'estimator/**'
      - 'evals/**'
      - 'scripts/**'
      - 'tests/**'
      - 'db/**'
      - '.arsumbris/**'
      - '.agents/skills/**'
      - 'arsumbris/**'
      - 'catalog/**'
      - 'inject/**'
      - 'profiles/**'
      - 'skills/**'
      - 'type/**'
      - 'workspace-*.yaml'
      - 'requirements-db.txt'
      - 'requirements-documents.txt'
      - 'quotes.csv'
      - 'docs/host-automation-prompt.md'
      - '.github/workflows/estimator.yml'

concurrency:
  group: estimator-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: estimator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: estimator/package-lock.json
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-documents.txt -r requirements-db.txt
        working-directory: .
      - run: node scripts/verify.mjs
        working-directory: .

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-db.txt
      - run: node scripts/verify.mjs --database
        env:
          KELLER_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres?sslmode=disable
