access_requirement: Permissioned bearer token plus owner-confirmed API, derived-pricing, display and AI-use licence; not yet verified.
cadence: MB-STE-0184 daily; MB-STE-0185 weekly; MB-STE-0883 weekly. Delivery speed does not increase assessment frequency.
